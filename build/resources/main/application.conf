ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
        host = ${?HOST}
    }
    application {
        modules = [ com.yeshuwahane.fairsplit.ApplicationKt.module ]
    }
}

app {
    environment = "dev"
    environment = ${?APP_ENV}
}

database {
    url = ""
    url = ${?DATABASE_URL}
    user = ""
    user = ${?DATABASE_USER}
    password = ""
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = 10
    maxPoolSize = ${?DATABASE_MAX_POOL_SIZE}
}

jwt {
    secret = "fairsplit-development-secret-key-32-chars-minimum"
    secret = ${?JWT_SECRET}
    issuer = "fairsplit"
    issuer = ${?JWT_ISSUER}
    audience = "fairsplit-api"
    audience = ${?JWT_AUDIENCE}
    accessTtlDays = 30
    accessTtlDays = ${?JWT_ACCESS_TTL_DAYS}
    refreshTtlDays = 90
    refreshTtlDays = ${?JWT_REFRESH_TTL_DAYS}
}

storage {
    uploadDir = "uploads"
    uploadDir = ${?UPLOAD_DIRECTORY}
    uploadDir = ${?UPLOAD_DIR}
}

